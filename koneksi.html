<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tes koneksi D1</title><link rel="stylesheet" href="/style.css"></head>
<body><header><a class="brand" href="/">Chord<span>Gitar</span></a><a href="/">Beranda</a></header><main><section class="hero"><small>DIAGNOSTIK READ-ONLY</small><h1>Tes koneksi D1</h1><p>Memeriksa koneksi database dan membaca struktur tabel. Tidak menambah, mengubah, atau menghapus data.</p><button class="btn" id="retry" type="button">Ulangi tes</button></section><section class="panel"><h2>Status koneksi</h2><pre id="health">Memeriksa…</pre></section><section class="panel"><h2>Struktur tabel</h2><pre id="schema">Menunggu…</pre></section></main><footer>Chord Gitar · Diagnostik</footer><script>async function run(){const h=document.querySelector('#health'),s=document.querySelector('#schema');h.textContent='Memeriksa /api/health…';s.textContent='Menunggu…';try{const r=await fetch('/api/health',{cache:'no-store'});const j=await r.json();h.textContent='HTTP '+r.status+'\n'+JSON.stringify(j,null,2);if(r.ok&&j.database_connected){const q=await fetch('/api/schema',{cache:'no-store'});const d=await q.json();s.textContent='HTTP '+q.status+'\n'+JSON.stringify(d,null,2)}else{s.textContent='Koneksi belum berhasil; struktur tidak dibaca.'}}catch(e){h.textContent='Gagal menghubungi API: '+e.message;s.textContent='Periksa deployment Pages Functions dan jaringan.'}}document.querySelector('#retry').addEventListener('click',run);run();</script></body></html>
